<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QG · Cockpit Hermes & Habblaud Escritório</title>
  <style>
    :root {
      --bg: #0c0e12;
      --bar-bg: #14171f;
      --border: #232836;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #f08a3c;
      --accent-hover: #fa9d58;
      --cockpit-color: #4aa8e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); }
    
    #top-bar {
      height: 48px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      user-select: none;
    }
    
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.05em;
      background: #1e2433;
      border: 1px solid #333c52;
      padding: 3px 8px;
      border-radius: 4px;
      color: #cbd5e1;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    
    .tabs-group {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      background: #1a202c;
      color: var(--text);
    }
    .tab-btn.active[data-tab="cockpit"] {
      background: #142538;
      border-color: #1e3d5f;
      color: var(--cockpit-color);
      font-weight: 600;
    }
    .tab-btn.active[data-tab="habblaud"] {
      background: #2e1d12;
      border-color: #59351e;
      color: var(--accent);
      font-weight: 600;
    }
    .tab-btn.active[data-tab="split"] {
      background: #1e2433;
      border-color: #333c52;
      color: #fff;
      font-weight: 600;
    }
    
    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ext-link {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1a202c;
      border: 1px solid #2d3748;
    }
    .ext-link:hover { color: #fff; border-color: #4a5568; }
    
    #viewport-container {
      width: 100%;
      height: calc(100% - 48px);
      position: relative;
    }
    
    .frame-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }
    .frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0c0e12;
    }
    
    /* Modo Lado a Lado (Split View) */
    .split-layout {
      display: none;
      width: 100%;
      height: 100%;
    }
    .split-layout.active {
      display: flex;
    }
    .split-pane {
      flex: 1;
      height: 100%;
      position: relative;
    }
    .split-pane:first-child {
      border-right: 2px solid var(--border);
    }
    .split-pane iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-green { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.6); }
    .dot-orange { background: #f08a3c; box-shadow: 0 0 6px rgba(240,138,60,0.6); }
  </style>
</head>
<body>

  <header id="top-bar">
    <div class="brand-group">
      <span class="brand-badge">QG CENTRAL</span>
      <span class="brand-title">Estação Unificada</span>
    </div>

    <nav class="tabs-group">
      <button class="tab-btn active" data-tab="cockpit">
        <span class="status-dot dot-green"></span> Cockpit Central (Hermes)
      </button>
      <button class="tab-btn" data-tab="habblaud">
        <span class="status-dot dot-orange"></span> Escritório de Agentes (Habblaud)
      </button>
      <button class="tab-btn" data-tab="split">
        ⚏ Lado a Lado (Split)
      </button>
    </nav>

    <div class="actions-group">
      <a class="ext-link" href="http://localhost:4747" target="_blank" title="Abrir Habblaud em nova aba">Habblaud ↗</a>
      <a class="ext-link" href="https://chavedocaso.com.br/cockpit" target="_blank" title="Abrir Cockpit em nova aba">Cockpit ↗</a>
    </div>
  </header>

  <main id="viewport-container">
    <!-- View Cockpit Full -->
    <div id="view-cockpit" class="frame-wrapper">
      <iframe src="https://chavedocaso.com.br/cockpit" title="Cockpit Central Hermes"></iframe>
    </div>

    <!-- View Habblaud Full -->
    <div id="view-habblaud" class="frame-wrapper" style="display: none;">
      <iframe src="http://localhost:4747" title="Escritório Virtual Habblaud"></iframe>
    </div>

    <!-- View Split (Lado a Lado) -->
    <div id="view-split" class="split-layout">
      <div class="split-pane">
        <iframe src="https://chavedocaso.com.br/cockpit" title="Cockpit Split"></iframe>
      </div>
      <div class="split-pane">
        <iframe src="http://localhost:4747" title="Habblaud Split"></iframe>
      </div>
    </div>
  </main>

  <script>
    const buttons = document.querySelectorAll('.tab-btn');
    const viewCockpit = document.getElementById('view-cockpit');
    const viewHabblaud = document.getElementById('view-habblaud');
    const viewSplit = document.getElementById('view-split');

    function switchTab(tab) {
      buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
      viewCockpit.style.display = tab === 'cockpit' ? 'block' : 'none';
      viewHabblaud.style.display = tab === 'habblaud' ? 'block' : 'none';
      viewSplit.classList.toggle('active', tab === 'split');
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
  </script>

</body>
</html>
